<!doctype html>
<html lang="en" class="cv-page">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--@head-->
  <script>
    // Visitors from Cyprus do not see the CV. Country comes from Cloudflare's /cdn-cgi/trace on this domain.
    // ?geo=XX overrides it for testing.
    (function () {
      var d = document.documentElement
      d.classList.add('geo-pending')
      var finish = function (c) {
        d.classList.remove('geo-pending')
        if (c === 'CY') {
          d.classList.add('geo-cy')
          if (location.pathname.indexOf('/cv') === 0) location.replace('/')
        }
      }
      var o = /[?&]geo=([A-Za-z]{2})/.exec(location.search)
      if (o) return finish(o[1].toUpperCase())
      var t = setTimeout(function () { finish('') }, 2000)
      fetch('/cdn-cgi/trace', { cache: 'no-store' })
        .then(function (r) { return r.text() })
        .then(function (x) { clearTimeout(t); var m = /(?:^|\n)loc=([A-Z]{2})/.exec(x); finish(m ? m[1] : '') })
        .catch(function () { clearTimeout(t); finish('') })
    })()
  </script>
  <link rel="stylesheet" href="/src/cv.css">
</head>
<body>
  <main class="cv">
<!--@cv-->
  </main>
  <!--@footer-->
</body>
</html>
