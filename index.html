<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!--@head-->
  <script>
    // Visitors from Cyprus, Portugal and Greece do not see the CV. Country comes from Cloudflare's /cdn-cgi/trace on this domain.
    // ?geo=XX overrides it for testing.
    (function () {
      var d = document.documentElement
      d.classList.add('geo-pending')
      var finish = function (c) {
        d.classList.remove('geo-pending')
        if (c === 'CY' || c === 'PT' || c === 'GR') {
          d.classList.add('geo-cy')
          if (location.pathname.indexOf('/cv') === 0) location.replace('/')
        }
      }
      var o = /[?&]geo=([A-Za-z]{2})/.exec(location.search)
      if (o) return finish(o[1].toUpperCase())
      var t = setTimeout(function () { finish('') }, 2000)
      fetch('/cdn-cgi/trace', { cache: 'no-store' })
        .then(function (r) { return r.text() })
        .then(function (x) { clearTimeout(t); var m = /(?:^|\n)loc=([A-Z]{2})/.exec(x); finish(m ? m[1] : '') })
        .catch(function () { clearTimeout(t); finish('') })
    })()
  </script>
  <link rel="preload" href="/fonts/silkscreen.woff2" as="font" type="font/woff2" crossorigin>
  <script>
    // Decide before first paint whether the 3D story runs. Static page otherwise.
    (function () {
      var d = document.documentElement, ok = true
      try {
        if (matchMedia('(prefers-reduced-motion: reduce)').matches) ok = false
        if (innerHeight > 1800 || innerWidth < 300) ok = false
        if (/bot|crawl|spider|lighthouse|headless/i.test(navigator.userAgent) && !/[?&]fx/.test(location.search)) ok = false
        if (!('WebGL2RenderingContext' in window)) ok = false
      } catch (e) { ok = false }
      if (/[?&]nofx/.test(location.search)) ok = false
      d.className += ok ? ' fx' : ' nofx'
      if (ok && !matchMedia('(pointer: coarse)').matches) d.className += ' preload'
      if ('scrollRestoration' in history && ok) history.scrollRestoration = 'manual'
    })()
  </script>
  <link rel="stylesheet" href="/src/styles.css">
</head>
<body>
  <a class="skip" href="#career">Skip to career</a>
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="loader" aria-hidden="true">
    <div class="loader-box">
      <div class="loader-text">Launching<span>.</span><span>.</span><span>.</span></div>
      <div class="loader-bar"><i></i></div>
    </div>
  </div>
  <div class="sky" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="/" data-go="hello" aria-label="Miroslaw Shpak, back to top"><span>Miroslaw&nbsp;Shpak</span></a>
    <nav class="nav" aria-label="Sections"><!--@nav--><a class="btn btn-small" href="/cv/" data-cv>CV</a></nav>
  </header>

  <main id="story">
<!--@story-->
  </main>

  <!--@footer-->

  <div class="hud" aria-hidden="true">
    <div class="hud-label"><span data-hud-label>Hello</span></div>
    <div class="hud-ruler"><div class="hud-strip" data-hud-strip></div></div>
    <svg class="hud-pin" viewBox="0 0 36 19"><path d="M1.16 18.5 18 .73 34.84 18.5z"/></svg>
  </div>
  <div class="scroll-tip" aria-hidden="true"><span></span></div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
